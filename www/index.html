<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>Inspeção OAEs</title>
    </head>
    <body>
        <header class="topbar">
            <h1 class="topbar-titulo">Inspeção</h1>
            <div class="topbar-acoes">
                <span id="status-conexao" class="status online">Online</span>
                <button id="btn-sincronizar" type="button">Sincronizar</button>
                <span id="fila-pendentes" class="fila" title="Patologias na fila de envio">0</span>
            </div>
        </header>

        <main class="conteudo">
            <div class="secao-cabecalho">
                <h2 class="secao-titulo">Projetos</h2>
                <button id="btn-novo-projeto" class="btn-adicionar" type="button" aria-label="Adicionar projeto" command="show-modal" commandfor="dialog-novo-projeto">+</button>
            </div>

            <ul id="lista-projetos" class="lista"></ul>

            <p id="lista-projetos-vazia" class="vazio">Nenhum projeto cadastrado.</p>
        </main>

        <dialog id="dialog-novo-projeto" class="modal" aria-labelledby="dialog-novo-projeto-titulo">
            <form id="form-novo-projeto" method="dialog">
                <h2 id="dialog-novo-projeto-titulo" class="modal-titulo">Novo projeto</h2>

                <label class="campo">
                    <span class="campo-rotulo">Nome do projeto</span>
                    <input id="input-nome-projeto" name="nome" type="text" required maxlength="80" autocomplete="off" autofocus>
                </label>

                <div class="modal-acoes">
                    <button type="submit" value="cancelar" class="btn-secundario" formnovalidate>Cancelar</button>
                    <button id="btn-salvar-ponte" type="submit" value="salvar" class="btn-primario">Salvar</button>
                </div>
            </form>
        </dialog>

        <template id="tpl-item-projeto">
            <li>
                <button type="button" class="item-projeto">
                    <span class="item-projeto-texto">
                        <span class="item-projeto-nome" id="item-projeto-nome"></span>
                    </span>
                    <span class="item-projeto-seta" aria-hidden="true">&rsaquo;</span>
                </button>
            </li>
        </template>

        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
